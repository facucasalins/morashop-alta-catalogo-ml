name: MORASHOP - Alta catálogo ML

# Manual, sin cron. Arma la planilla de ML a partir del Sheet
# «Paso 1 - CARGA CATALOGOS MELI» (filas en estado «listo»).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: valida y genera el xlsx pero NO toca el Sheet'
        required: true
        type: choice
        options: ['true', 'false']
        default: 'true'
      max:
        description: 'Máximo de productos en el lote (cupo actual de ML)'
        required: true
        type: string
        default: '24'
      categoria:
        description: 'Categoría (tiene que coincidir con la hoja de la planilla de ML)'
        required: true
        type: string
        default: 'Suplementos'

jobs:
  alta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install gspread==6.1.4 google-auth==2.35.0 openpyxl==3.1.5 requests==2.32.3

      - name: Generar lote
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # No son secretos: IDs del Sheet y carpetas de Drive de MoraShop
          ALTA_SHEET_ID: 1r5jQKVFLpxTqhfGQBnqOnU4lC7PGCB8zn5ybdNrECg4
          DRIVE_FOLDER_PLANTILLAS: 174YUEgqAqd5JDvvBy4qc7w3WkUAr_exY
          # DRIVE_FOLDER_SALIDA: (opcional) ID de carpeta «Lotes generados»
          OUTPUT_DIR: /tmp/alta_ml
        run: |
          ARGS="--max ${{ inputs.max }} --categoria ${{ inputs.categoria }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "python scripts/alta_catalogo_ml.py $ARGS"
          python scripts/alta_catalogo_ml.py $ARGS

      - name: Subir lote + reporte como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alta-ml-lote
          path: /tmp/alta_ml/*
          retention-days: 30
          if-no-files-found: warn
